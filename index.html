<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>周行事例批注台</title>
  <link rel="icon" href="data:,">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#0F766E">
  <link rel="stylesheet" href="css/style.css?v=20260831k">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">周</span>
      <div class="brand-text">
        <h1>周行事例批注台</h1>
        <p>导入周行事例 · 日历事件 · 按日批注 · 统计导出</p>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="seg tab-switch" id="tabSwitch" role="group" aria-label="页签">
        <button type="button" data-tab="calendar" class="active">日历</button>
        <button type="button" data-tab="stats">统计</button>
        <button type="button" data-tab="data">数据</button>
      </div>
      <button id="btnTheme" class="icon-btn" type="button" title="切换主题">◐</button>
    </div>
  </header>

  <main class="app-body" id="calendarArea">
    <section class="calendar-area">
      <div class="cal-toolbar">
        <div class="cal-nav">
          <button id="btnPrev" class="btn btn-ghost btn-sm" type="button" title="上一个">‹</button>
          <button id="btnToday" class="btn btn-ghost btn-sm" type="button">今天</button>
          <button id="btnNext" class="btn btn-ghost btn-sm" type="button" title="下一个">›</button>
        </div>
        <h2 id="calTitle"></h2>
        <div class="seg" id="viewSwitch" role="group" aria-label="视图切换">
          <button type="button" data-view="month" class="active">月</button>
          <button type="button" data-view="week">周</button>
          <button type="button" data-view="day">日</button>
        </div>
        <div class="cal-legend">
          <span class="lg"><i class="lg-swatch allday"></i>全天</span>
          <span class="lg" title="当前视图范围内的事件数"><i class="count-badge evt" id="legendEventCount">0</i>事件数</span>
          <span class="lg" title="当前视图范围内的批注数"><i class="count-badge anno" id="legendAnnoCount">0</i>批注数</span>
          <span class="lg"><i class="lg-conflict-demo">⚠</i>冲突</span>
        </div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </section>
  </main>

  <div id="dayPanel" class="day-overlay" hidden></div>

  <section id="statsArea" class="stats-area" hidden></section>

  <section id="dataArea" class="data-area" hidden>
    <div class="data-head">
      <h2>数据管理</h2>
      <p>导入周行事例、备份与恢复、清空数据都在这里。</p>
    </div>
    <div class="data-grid">
      <div class="data-card">
        <h3>导入周行事例</h3>
        <p class="data-desc">支持 .docx / .xlsx / .xls / .csv / .txt，自动识别标准表与「周次 × 周一~周日」周历网格模板。</p>
        <button id="btnImport" class="btn btn-primary" type="button">⇪ 导入周行事例</button>
        <h4>最近导入记录</h4>
        <div id="dataImportHistory" class="history-list"></div>
      </div>
      <div class="data-card">
        <h3>备份与恢复</h3>
        <p class="data-desc">当前数据：事件 <b id="dataEventCount">0</b> 条 · 批注 <b id="dataAnnoCount">0</b> 条（仅存本机浏览器）</p>
        <div class="data-actions">
          <button id="btnBackup" class="btn" type="button">⬇ 导出备份（JSON）</button>
          <button id="btnRestore" class="btn" type="button">⇪ 从备份恢复</button>
          <button id="btnClear" class="btn danger-text" type="button">🗑 清空全部数据</button>
        </div>
        <p class="data-hint">备份可跨设备/浏览器恢复；清空前请先导出备份。</p>
      </div>
    </div>
  </section>

  <div class="fab-group" id="fabGroup" hidden>
    <button id="btnFabAnno" class="fab fab-anno" type="button">＋ 添加批注</button>
    <button id="btnFabEvent" class="fab fab-event" type="button">＋ 添加事件</button>
  </div>

  <input type="file" id="restoreInput" accept=".json" hidden>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>

  <script src="vendor/xlsx.full.min.js?v=20260831k"></script>
  <script src="vendor/papaparse.min.js?v=20260831k"></script>
  <script src="vendor/mammoth.browser.min.js?v=20260831k"></script>
  <script src="vendor/echarts.min.js?v=20260831k"></script>
  <script src="js/util/dateutil.js?v=20260831k"></script>
  <script src="js/util/aliases.js?v=20260831k"></script>
  <script src="js/core/rowparser.js?v=20260831k"></script>
  <script src="js/core/parser.js?v=20260831k"></script>
  <script src="js/core/stats.js?v=20260831k"></script>
  <script src="js/core/store.js?v=20260831k"></script>
  <script src="js/core/filereader.js?v=20260831k"></script>
  <script src="js/ui/toast.js?v=20260831k"></script>
  <script src="js/ui/eventform.js?v=20260831k"></script>
  <script src="js/ui/annoform.js?v=20260831k"></script>
  <script src="js/ui/daypanel.js?v=20260831k"></script>
  <script src="js/ui/calendar.js?v=20260831k"></script>
  <script src="js/ui/importmodal.js?v=20260831k"></script>
  <script src="js/ui/statspanel.js?v=20260831k"></script>
  <script src="js/app.js?v=20260831k"></script>
</body>
</html>
